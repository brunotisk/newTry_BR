<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      color: #FAFAFA;
      font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      overflow: visible;
    }
    .wrap { width: 100%; position: relative; }
    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 6px 0;
    }
    .label {
      display: block;
      margin: 0;
      color: #FAFAFA;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }
    /* Grupo de opções (radio) para escolher o modo de busca: substitui o
       switch anterior (que tinha uma sensação de atraso visual) por uma
       seleção direta entre "Cod. Produto" (padrão) e "Descrição". */
    .mode-radio {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      border: 1px solid #464B53;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .mode-option {
      display: flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 400;
      line-height: 1.3;
      color: rgb(163, 168, 184);
      white-space: nowrap;
      user-select: none;
      transition: background .12s ease, color .12s ease;
    }
    .mode-option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .mode-option:hover {
      color: #FAFAFA;
    }
    .mode-option.active {
      background: #FF4B4B;
      color: #FAFAFA;
    }
    .selectbox {
      position: relative;
      width: 100%;
    }
    .control {
      width: 100%;
      min-height: 40px;
      /* Espaço para copiar, limpar e a seta à direita. */
      padding: 0 92px 0 12px;
      border: 1px solid #464B53;
      border-radius: 6px;
      background: #262730;
      color: #FAFAFA;
      display: flex;
      align-items: center;
      cursor: text;
      position: relative;
    }
    .control:focus-within {
      border-color: #FF4B4B;
      box-shadow: 0 0 0 1px #FF4B4B;
    }
    input {
      width: 100%;
      height: 38px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #FAFAFA;
      font: inherit;
      min-width: 0;
    }
    input::placeholder { color: #8B8D98; opacity: 1; }
    .copy-selected-btn {
      position: absolute;
      right: 58px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #8B8D98;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .copy-selected-btn.visible { display: flex; }
    .copy-selected-btn:hover {
      color: #FAFAFA;
      background: rgba(255, 255, 255, 0.08);
    }
    .copy-selected-btn.copied { color: #21C55D; }
    .clear-btn {
      position: absolute;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #8B8D98;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .clear-btn.visible { display: flex; }
    .clear-btn:hover {
      color: #FAFAFA;
      background: rgba(255, 255, 255, 0.08);
    }
    .arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid #FAFAFA;
      border-bottom: 2px solid #FAFAFA;
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }
    .menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      max-height: 300px;
      overflow-y: auto;
      z-index: 99999;
      background: #262730;
      border: 1px solid #464B53;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
      padding: 4px 0;
      display: none;
    }
    .menu.open { display: block; }
    .option {
      padding: 0;
      color: #FAFAFA;
      cursor: pointer;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .option:hover, .option.active { background: #3A3B46; }
    .option-label {
      flex: 1 1 auto;
      min-width: 0;
      padding: 9px 4px 9px 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy-code-btn {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      margin-right: 5px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #8B8D98;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 15px;
      line-height: 1;
    }
    .copy-code-btn:hover {
      color: #FAFAFA;
      background: rgba(255, 255, 255, 0.10);
    }
    .copy-code-btn.copied {
      color: #21C55D;
    }
    .empty { padding: 10px 12px; color: #8B8D98; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label-row">
      <div class="label" id="label"></div>
      <div class="mode-radio" id="modeRadio" role="radiogroup" aria-label="Modo de busca">
        <label class="mode-option" data-mode="codigo">
          <input type="radio" name="modo_busca" value="codigo" checked />
          <span>Cod. Produto</span>
        </label>
        <label class="mode-option" data-mode="descricao">
          <input type="radio" name="modo_busca" value="descricao" />
          <span>Descrição</span>
        </label>
      </div>
    </div>
    <div class="selectbox">
      <div class="control" id="control">
        <input id="input" autocomplete="off" spellcheck="false" />
        <button type="button" class="copy-selected-btn" id="copySelectedBtn" aria-label="Copiar código do produto" tabindex="-1">📋</button>
        <button type="button" class="clear-btn" id="clearBtn" aria-label="Limpar" tabindex="-1">✕</button>
        <span class="arrow"></span>
      </div>
      <div class="menu" id="menu"></div>
    </div>
  </div>

<script>
  const labelEl = document.getElementById("label");
  const input = document.getElementById("input");
  const menu = document.getElementById("menu");
  const control = document.getElementById("control");
  const copySelectedBtn = document.getElementById("copySelectedBtn");
  const clearBtn = document.getElementById("clearBtn");
  const modeRadio = document.getElementById("modeRadio");
  const modeOptions = modeRadio.querySelectorAll(".mode-option");
  const modeInputs = modeRadio.querySelectorAll('input[name="modo_busca"]');

  let args = { opcoes: [], rotulo_selecionado: null, codigo_selecionado: null, buscar_descricao: false, valor_selecionado: null, termo: "", placeholder: "" };
  let selectedId = null;
  let codigoSelecionado = "";
  let lastQuery = "";
  let activeIndex = -1;
  let suppressNextInput = false;
  // Evita que o .focus() programático (usado ao limpar a seleção) reabra o
  // menu — só queremos manter o cursor no campo, não reabrir a lista.
  let suppressNextFocusOpen = false;
  // Estado do modo de busca (código vs. descrição). Vive aqui no componente
  // e é sincronizado com args.buscar_descricao a cada render() vindo do
  // Python — mas atualizado localmente na hora do clique, pra feedback
  // visual instantâneo antes da resposta do servidor chegar.
  let buscarDescricao = false;
  // Guarda contra "render" com argumentos desatualizados: quando o Python
  // ainda não processou a troca de modo (ver selecionarModoBusca), o valor
  // selecionado que chega em args pode ser o ANTIGO por mais um ciclo. Esses
  // dois valores permitem ignorar esse render específico e manter o campo
  // limpo que já aplicamos localmente, até o Python realmente confirmar.
  let modoTrocandoAguardandoSync = false;
  let idAntesDaTroca = null;

  // A filtragem por código/descrição passou a acontecer no servidor (Python),
  // usando exatamente o mesmo critério de antes. Isso evita reenviar o
  // catálogo inteiro ao iframe a cada tecla digitada — args.opcoes já chega
  // pronto (filtrado e limitado) a cada re-render.
  function opcoesAtuais() {
    return args.opcoes || [];
  }

  function atualizarBotaoLimpar() {
    const temConteudo = input.value.trim().length > 0 || selectedId !== null;
    clearBtn.classList.toggle("visible", temConteudo);
  }

  function atualizarBotaoCopiarSelecionado() {
    const codigo = codigoSelecionado;
    const visivel = selectedId !== null && !!codigo;
    copySelectedBtn.classList.toggle("visible", visivel);
    copySelectedBtn.title = visivel ? `Copiar código ${codigo}` : "Copiar código do produto";
    copySelectedBtn.setAttribute("aria-label", copySelectedBtn.title);
  }

  function limparSelecao() {
    modoTrocandoAguardandoSync = false;
    selectedId = null;
    codigoSelecionado = "";
    lastQuery = "";
    suppressNextInput = true;
    input.value = "";
    atualizarBotaoLimpar();
    atualizarBotaoCopiarSelecionado();
    suppressNextFocusOpen = true;
    input.focus();
    closeMenu();
  }

  function send(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value
    }, "*");
  }

  // Toda mensagem enviada ao Python carrega o modo de busca atual — assim o
  // servidor sempre sabe se deve filtrar por código ou por descrição,
  // independentemente de qual interação disparou o envio.
  function enviarEstado(extra) {
    send(Object.assign({ buscar_descricao: buscarDescricao }, extra));
  }

  async function copiarParaAreaTransferencia(texto) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        return true;
      }

      // Fallback para navegadores/ambientes em que a API Clipboard não está
      // disponível dentro do iframe do componente.
      const auxiliar = document.createElement("textarea");
      auxiliar.value = texto;
      auxiliar.setAttribute("readonly", "");
      auxiliar.style.position = "fixed";
      auxiliar.style.opacity = "0";
      document.body.appendChild(auxiliar);
      auxiliar.select();
      auxiliar.setSelectionRange(0, auxiliar.value.length);
      const ok = document.execCommand("copy");
      auxiliar.remove();
      return ok;
    } catch (error) {
      return false;
    }
  }

  function renderMenu() {
    const options = opcoesAtuais();
    menu.innerHTML = "";
    activeIndex = -1;

    if (!options.length) {
      if (lastQuery.trim()) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nenhum produto encontrado.";
        menu.appendChild(empty);
      }
      return;
    }

    options.slice(0, 100).forEach((option, index) => {
      const el = document.createElement("div");
      el.className = "option";
      el.title = option.rotulo;

      const label = document.createElement("div");
      label.className = "option-label";
      label.textContent = option.rotulo;

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy-code-btn";
      copyBtn.textContent = "📋";
      copyBtn.title = `Copiar código ${option.codigo || ""}`.trim();
      copyBtn.setAttribute("aria-label", `Copiar código ${option.codigo || ""}`.trim());

      // O botão de copiar não seleciona o produto nem fecha a lista.
      copyBtn.addEventListener("mousedown", (event) => {
        event.preventDefault();
        event.stopPropagation();
      });
      copyBtn.addEventListener("click", async (event) => {
        event.preventDefault();
        event.stopPropagation();

        const codigo = String(option.codigo || "").trim();
        if (!codigo) return;

        const copiado = await copiarParaAreaTransferencia(codigo);
        if (copiado) {
          copyBtn.textContent = "✓";
          copyBtn.classList.add("copied");
          copyBtn.title = `Código ${codigo} copiado`;
          setTimeout(() => {
            copyBtn.textContent = "📋";
            copyBtn.classList.remove("copied");
            copyBtn.title = `Copiar código ${codigo}`;
          }, 1200);
        }
      });

      el.addEventListener("mousedown", (event) => {
        if (event.target === copyBtn || copyBtn.contains(event.target)) return;
        event.preventDefault();
        selectOption(option);
      });

      el.appendChild(label);
      el.appendChild(copyBtn);
      menu.appendChild(el);
    });
  }

  function setFrameHeight(height) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: height
    }, "*");
  }

  function openMenu() {
    renderMenu();
    menu.classList.add("open");
    // O frame cresce apenas enquanto a lista está aberta. A tela principal
    // compensa esse espaço para que a tabela permaneça na mesma posição.
    setFrameHeight(368);
    enviarEstado({ id: selectedId, termo: lastQuery, aberto: true });
  }

  function closeMenu(resetUnselected = false) {
    menu.classList.remove("open");
    activeIndex = -1;

    // Se o usuário apenas iniciou uma busca e saiu do componente sem
    // selecionar um produto, descarta o termo digitado e volta ao estado
    // inicial ("Todos os produtos").
    if (resetUnselected && selectedId === null) {
      lastQuery = "";
      suppressNextInput = true;
      input.value = "";
      atualizarBotaoLimpar();
    }

    setFrameHeight(76);
    enviarEstado({
      id: selectedId,
      termo: selectedId === null ? "" : lastQuery,
      aberto: false
    });
  }

  function selectOption(option) {
    modoTrocandoAguardandoSync = false;
    selectedId = option.id;
    codigoSelecionado = String(option.codigo || "").trim();
    lastQuery = option.rotulo;
    suppressNextInput = true;
    input.value = option.rotulo;
    atualizarBotaoLimpar();
    atualizarBotaoCopiarSelecionado();
    closeMenu();
    enviarEstado({ id: option.id, termo: option.rotulo });
  }

  function clearSelectionForTyping() {
    if (selectedId !== null) {
      modoTrocandoAguardandoSync = false;
      selectedId = null;
      codigoSelecionado = "";
      enviarEstado({ id: null, termo: input.value });
    }
  }

  function placeholderPadrao() {
    // Usado quando args.placeholder não é enviado pelo Python: o próprio
    // componente decide o texto de acordo com o modo de busca atual.
    return buscarDescricao
      ? "Todos os produtos - busca por Descrição"
      : "Todos os produtos - busca por Cod. Produto";
  }

  function aplicarModoNoBotao() {
    modeInputs.forEach((el) => {
      el.checked = (el.value === "descricao") === buscarDescricao;
    });
    modeOptions.forEach((el) => {
      const ativo = (el.dataset.mode === "descricao") === buscarDescricao;
      el.classList.toggle("active", ativo);
    });
  }

  function selecionarModoBusca(novoBuscarDescricao) {
    if (novoBuscarDescricao === buscarDescricao) return;
    buscarDescricao = novoBuscarDescricao;
    aplicarModoNoBotao();

    // Trocar o modo invalida a busca atual: um termo de código não faz
    // sentido filtrando por descrição, e vice-versa — mesmo comportamento
    // que produtos.py tinha antes ao limpar a seleção no on_change do
    // st.toggle separado.
    // Guarda o id que estava selecionado ANTES da troca: enquanto o Python
    // não confirmar a limpeza (id: null) de volta, ignoramos qualquer
    // render() que ainda venha com esse id antigo, para o rótulo do
    // produto não "voltar" por cima do campo já limpo.
    idAntesDaTroca = selectedId;
    modoTrocandoAguardandoSync = idAntesDaTroca !== null;

    selectedId = null;
    codigoSelecionado = "";
    lastQuery = "";
    suppressNextInput = true;
    input.value = "";
    input.placeholder = placeholderPadrao();
    atualizarBotaoLimpar();
    atualizarBotaoCopiarSelecionado();
    // Fecha a lista caso já estivesse aberta — trocar o modo não deve
    // abrir (nem manter aberto) o dropdown de opções.
    menu.classList.remove("open");
    activeIndex = -1;
    setFrameHeight(76);
    // Só reposiciona o cursor no campo — não deve abrir a lista de opções
    // ao clicar no radio (o "focus" abriria o menu, então suprimimos isso).
    suppressNextFocusOpen = true;
    input.focus();
    enviarEstado({ id: null, termo: "" });
  }

  function render(newArgs) {
    args = newArgs || {};
    labelEl.textContent = args.label || "Produto";

    buscarDescricao = !!args.buscar_descricao;
    aplicarModoNoBotao();
    input.placeholder = args.placeholder || placeholderPadrao();

    const externalId = args.valor_selecionado;

    if (modoTrocandoAguardandoSync) {
      if (externalId === idAntesDaTroca) {
        // O Python ainda não processou a troca de modo — estes args estão
        // um ciclo atrasados. Ignora a sincronização de seleção deste
        // render (o campo já está limpo localmente) até o valor real
        // (null) chegar.
        if (menu.classList.contains("open")) renderMenu();
        atualizarBotaoLimpar();
        atualizarBotaoCopiarSelecionado();
        return;
      }
      modoTrocandoAguardandoSync = false;
    }

    // O rótulo do item selecionado já vem pronto do Python (calculado a
    // partir da lista completa, não da lista filtrada pela busca), então não
    // precisamos mais procurar o id dentro de args.opcoes aqui.
    // Só sincroniza valor externo quando o usuário não está digitando.
    if (document.activeElement !== input) {
      if (externalId != null && args.rotulo_selecionado) {
        selectedId = externalId;
        codigoSelecionado = String(args.codigo_selecionado || "").trim();
        lastQuery = args.rotulo_selecionado;
        input.value = args.rotulo_selecionado;
      } else if (externalId == null) {
        selectedId = null;
        codigoSelecionado = "";
        lastQuery = String(args.termo || "");
        input.value = lastQuery;
      }
    }

    if (menu.classList.contains("open")) renderMenu();
    atualizarBotaoLimpar();
    atualizarBotaoCopiarSelecionado();
  }

  modeOptions.forEach((el) => {
    el.addEventListener("mousedown", (event) => {
      // Evita que o clique tire o foco do input antes da hora (mesmo
      // padrão usado nas opções da lista de produtos).
      event.preventDefault();
    });
    el.addEventListener("click", () => {
      selecionarModoBusca(el.dataset.mode === "descricao");
    });
  });

  input.addEventListener("focus", () => {
    if (suppressNextFocusOpen) {
      suppressNextFocusOpen = false;
      return;
    }
    openMenu();
  });

  input.addEventListener("input", () => {
    if (suppressNextInput) {
      suppressNextInput = false;
      return;
    }
    modoTrocandoAguardandoSync = false;
    if (selectedId !== null) {
      selectedId = null;
      codigoSelecionado = "";
    }
    lastQuery = input.value;
    atualizarBotaoLimpar();
    atualizarBotaoCopiarSelecionado();
    openMenu();
    enviarEstado({ id: null, termo: lastQuery });
  });

  // mousedown com preventDefault evita que o input perca o foco ao clicar no "x".
  clearBtn.addEventListener("mousedown", (event) => {
    event.preventDefault();
  });

  clearBtn.addEventListener("click", () => {
    limparSelecao();
  });

  // Exibido somente após selecionar um produto. Mantemos a ação no iframe
  // para que o gesto do usuário tenha permissão de gravar na área de transferência.
  copySelectedBtn.addEventListener("mousedown", (event) => {
    event.preventDefault();
    event.stopPropagation();
  });

  copySelectedBtn.addEventListener("click", async (event) => {
    event.preventDefault();
    event.stopPropagation();
    const codigo = codigoSelecionado;
    if (!codigo) return;

    const copiado = await copiarParaAreaTransferencia(codigo);
    if (!copiado) return;

    copySelectedBtn.textContent = "✓";
    copySelectedBtn.classList.add("copied");
    copySelectedBtn.title = `Código ${codigo} copiado`;
    setTimeout(() => {
      copySelectedBtn.textContent = "📋";
      copySelectedBtn.classList.remove("copied");
      atualizarBotaoCopiarSelecionado();
    }, 1200);
  });

  // A seta (e o espaço reservado a ela) fica visualmente dentro de
  // ".control", mas fora da caixa real do <input> (que não ocupa a área de
  // padding reservada à seta/botão de limpar). Sem isso, clicar bem em cima
  // da seta não focava o input e a busca não abria.
  control.addEventListener("mousedown", (event) => {
    if (event.target === clearBtn || event.target === copySelectedBtn || event.target === input) return;
    event.preventDefault();
    if (document.activeElement === input) {
      // Já focado (ex.: usuário fechou com Escape e clicou de novo): reabre.
      openMenu();
    } else {
      input.focus();
    }
  });

  input.addEventListener("keydown", (event) => {
    const options = opcoesAtuais();
    if (event.key === "Escape") {
      closeMenu(true);
      return;
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (!menu.classList.contains("open")) openMenu();
      activeIndex = Math.min(activeIndex + 1, options.length - 1);
      [...menu.querySelectorAll(".option")].forEach((el, i) => el.classList.toggle("active", i === activeIndex));
      return;
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      [...menu.querySelectorAll(".option")].forEach((el, i) => el.classList.toggle("active", i === activeIndex));
      return;
    }
    if (event.key === "Enter" && activeIndex >= 0 && options[activeIndex]) {
      event.preventDefault();
      selectOption(options[activeIndex]);
    }
  });

  document.addEventListener("mousedown", (event) => {
    if (!event.target.closest(".selectbox")) closeMenu(true);
  });

  // O listener acima só enxerga cliques dentro do próprio iframe.
  // Quando o clique acontece fora do componente (no restante da página
  // Streamlit), esse "mousedown" nunca dispara, porque é um documento
  // diferente. Para cobrir esse caso, usamos o evento "blur" da window:
  // ele dispara sempre que o foco sai do iframe, independente de origem.
  window.addEventListener("blur", () => {
    // Pequeno delay para não fechar o menu quando o próprio clique numa
    // opção (mousedown + preventDefault) mantém o foco no input.
    setTimeout(() => {
      if (document.activeElement !== input && menu.classList.contains("open")) {
        closeMenu(true);
      }
    }, 0);
  });

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (data && data.type === "streamlit:render") render(data.args || {});
  });

  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
  setFrameHeight(76);
</script>
</body>
</html>
