<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body {
      color: #FAFAFA;
      font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    /* Mesmos tokens de cor/raio já usados em busca_produto e ordenacao,
       pra este componente ficar visualmente consistente com os outros. */
    :root {
      --bg: #262730;
      --border: #464B53;
      --border-hover: #5A5D68;
      --accent: #FF4B4B;
      --accent-wash: rgba(255, 75, 75, .1);
      --text: #FAFAFA;
      --text-muted: #A3A8B8;
      --hover-bg: #31323D;
      --active-bg: #3A3B46;
      --radius: 6px;
    }

    .wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      height: 20px;
      line-height: 20px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      padding: 0;
    }

    /* Quando quem chama o componente já renderiza o próprio rótulo em
       markdown (ex.: telas/vendas.py, com "**Quantidade**" fora do
       componente), label="" é passado e este rótulo interno some por
       completo — inclusive o espaço reservado a ele — em vez de cair de
       volta no texto "Quantidade" e duplicar o label. */
    .field-label.hidden {
      display: none;
    }

    .control-row {
      width: 100%;
      height: 40px;
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    /* O contador (-, valor, +) é UM controle único com borda só por fora —
       antes cada pedaço tinha sua própria borda e elas se somavam onde se
       tocavam, dando aquele efeito de "borda dupla". Aqui a separação entre
       os três é só uma linha fina interna (.divider). */
    .counter {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      overflow: hidden;
      transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
    }

    .counter:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    /* Estado desbloqueado: um único selo visual (fundo/borda com leve tom da
       cor de destaque) comunica "isto está editável agora" — em vez de só
       trocar a cor do input, o controle inteiro assume o estado. */
    .counter.unlocked {
      background: linear-gradient(0deg, var(--accent-wash), var(--accent-wash)), var(--bg);
      border-color: #8a4a4a;
    }
    .counter.unlocked:focus-within {
      border-color: var(--accent);
    }

    .step {
      all: unset;
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color .12s ease, color .12s ease, transform .08s ease;
    }

    .step svg {
      width: 14px;
      height: 14px;
      pointer-events: none;
    }

    .step:hover:not(:disabled) {
      background: var(--hover-bg);
      color: var(--text);
    }

    .step:active:not(:disabled) {
      background: var(--active-bg);
      transform: scale(.92);
    }

    .step:disabled {
      color: #5C5F69;
      cursor: default;
    }

    .divider {
      width: 1px;
      flex: 0 0 1px;
      background: var(--border);
    }

    .value-wrap {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
    }

    .value {
      all: unset;
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: default;
    }

    .value.unlocked {
      cursor: text;
    }

    .value.unlocked::selection {
      background: var(--accent);
      color: #FFFFFF;
    }

    /* O cadeado fica depois do contador, como no layout solicitado. */
    .lock {
      all: unset;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color .12s ease, border-color .12s ease, color .12s ease, transform .08s ease;
    }

    .lock svg {
      width: 15px;
      height: 15px;
      pointer-events: none;
    }

    .lock:hover {
      background: var(--hover-bg);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .lock:active {
      transform: scale(.92);
    }

    .lock.unlocked {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-wash);
    }

    /* Remove as setas nativas do input number para manter o visual limpo. */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    @media (prefers-reduced-motion: reduce) {
      .counter, .step, .lock, .value { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="field-label" id="label">Quantidade</div>
    <div class="control-row">
      <div class="counter" id="counter">
        <button class="step" id="minus" type="button" aria-label="Diminuir quantidade">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="3" y1="8" x2="13" y2="8"/>
          </svg>
        </button>
        <div class="divider"></div>
        <div class="value-wrap">
          <input class="value" id="value" type="number" min="1" step="1" aria-label="Quantidade" />
        </div>
        <div class="divider"></div>
        <button class="step" id="plus" type="button" aria-label="Aumentar quantidade">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="8" y1="3" x2="8" y2="13"/>
            <line x1="3" y1="8" x2="13" y2="8"/>
          </svg>
        </button>
      </div>
      <button class="lock" id="lock" type="button" aria-label="Desbloquear edição manual" title="Desbloquear edição manual">
        <svg id="lockClosed" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="7.2" width="9" height="6.3" rx="1.4"/>
          <path d="M5.3 7.2V5.4a2.7 2.7 0 0 1 5.4 0v1.8"/>
        </svg>
        <svg id="lockOpen" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <rect x="3.5" y="7.2" width="9" height="6.3" rx="1.4"/>
          <path d="M5.3 7.2V5.4a2.7 2.7 0 0 1 5.4 0"/>
        </svg>
      </button>
    </div>
  </div>

<script>
  let args = { valor: 1, min_valor: 1, bloqueado: true };
  let valor = 1;
  let minValor = 1;
  let bloqueado = true;
  let pronto = false;

  const labelEl = document.getElementById("label");
  const counterEl = document.getElementById("counter");
  const valueEl = document.getElementById("value");
  const minusEl = document.getElementById("minus");
  const plusEl = document.getElementById("plus");
  const lockEl = document.getElementById("lock");
  const lockClosedEl = document.getElementById("lockClosed");
  const lockOpenEl = document.getElementById("lockOpen");

  function clamp(v) {
    let n = parseInt(v, 10);
    if (!Number.isFinite(n)) n = minValor;
    return Math.max(minValor, n);
  }

  function setFrameHeight(h) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: h
    }, "*");
  }

  function enviar() {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: { valor: valor, bloqueado: bloqueado }
    }, "*");
  }

  function render() {
    // args.label vazio ("") ou ausente = quem chamou já mostra o próprio
    // rótulo fora do componente. Só cai em "Quantidade" quando o label
    // não foi informado (undefined/null), nunca quando veio "" de propósito.
    const temLabel = args.label !== "" && args.label !== undefined && args.label !== null;
    labelEl.classList.toggle("hidden", !temLabel);
    labelEl.textContent = temLabel ? args.label : "";
    setFrameHeight(temLabel ? 68 : 42);

    valor = clamp(valor);
    valueEl.value = String(valor);
    valueEl.readOnly = bloqueado;
    valueEl.classList.toggle("unlocked", !bloqueado);
    counterEl.classList.toggle("unlocked", !bloqueado);
    minusEl.disabled = valor <= minValor;

    lockClosedEl.style.display = bloqueado ? "" : "none";
    lockOpenEl.style.display = bloqueado ? "none" : "";
    lockEl.classList.toggle("unlocked", !bloqueado);
    lockEl.setAttribute("aria-label", bloqueado ? "Desbloquear edição manual" : "Bloquear edição manual");
    lockEl.title = bloqueado ? "Desbloquear edição manual" : "Bloquear edição manual";
  }

  minusEl.addEventListener("click", () => {
    valor = clamp(valor - 1);
    render();
    enviar();
  });

  plusEl.addEventListener("click", () => {
    valor = clamp(valor + 1);
    render();
    enviar();
  });

  lockEl.addEventListener("click", () => {
    bloqueado = !bloqueado;
    render();
    enviar();
    if (!bloqueado) {
      valueEl.focus();
      valueEl.select();
    }
  });

  valueEl.addEventListener("input", () => {
    if (bloqueado) return;
    if (valueEl.value === "") return;
    valor = clamp(valueEl.value);
    enviar();
  });

  valueEl.addEventListener("blur", () => {
    valor = clamp(valueEl.value);
    render();
    enviar();
  });

  valueEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      valueEl.blur();
      return;
    }
    // Pequeno extra: setas para cima/baixo incrementam quando desbloqueado,
    // sem mudar nada do comportamento/contrato externo do componente.
    if (!bloqueado && (event.key === "ArrowUp" || event.key === "ArrowDown")) {
      event.preventDefault();
      valor = clamp(valor + (event.key === "ArrowUp" ? 1 : -1));
      render();
      enviar();
    }
  });

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (data && data.type === "streamlit:render") {
      args = data.args || args;
      minValor = Math.max(1, parseInt(args.min_valor ?? 1, 10) || 1);
      if (!pronto) {
        valor = clamp(args.valor ?? 1);
        bloqueado = !!args.bloqueado;
        pronto = true;
      }
      render();
    }
  });

  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
  setTimeout(render, 0);
</script>
</body>
</html>
