<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { padding: 0 0 2px 0; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #fafafa; }
    input {
      width: 100%; height: 38px; padding: 0 12px; border: 1px solid #4a4a55;
      border-radius: 6px; font-size: 16px; font-weight: 400; color: #f0f0f0;
      outline: none; background: #262730; caret-color: #f0f0f0;
    }
    input::placeholder { color: #9a9aa3; opacity: 1; }
    input:focus { border-color: #ff4b4b; box-shadow: 0 0 0 1px #ff4b4b; }
  </style>
</head>
<body>
  <div class="wrap">
    <label id="label"></label>
    <input id="input" autocomplete="off" />
  </div>
  <script>
    const input = document.getElementById("input");
    const label = document.getElementById("label");
    let tipoAtual = "telefone";

    function formatTelefone(raw) {
      const digits = String(raw || "").replace(/\D/g, "").slice(0, 11);
      if (!digits) return "";
      if (digits.length <= 2) return "(" + digits;
      if (digits.length <= 7) return "(" + digits.slice(0, 2) + ") " + digits.slice(2);
      return "(" + digits.slice(0, 2) + ") " + digits.slice(2, 7) + "-" + digits.slice(7);
    }

    function formatData(raw) {
      const digits = String(raw || "").replace(/\D/g, "").slice(0, 8);
      if (digits.length <= 2) return digits;
      if (digits.length <= 4) return digits.slice(0, 2) + "/" + digits.slice(2);
      return digits.slice(0, 2) + "/" + digits.slice(2, 4) + "/" + digits.slice(4);
    }

    function format(raw) {
      return tipoAtual === "data" ? formatData(raw) : formatTelefone(raw);
    }

    function sendValue() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: input.value
      }, "*");
    }

    function setFrameHeight() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: 72
      }, "*");
    }

    function render(args) {
      tipoAtual = args.tipo || "telefone";
      label.textContent = args.label || "";
      input.placeholder = args.placeholder || "";
      const incoming = format(args.value || "");
      if (document.activeElement !== input || input.value !== incoming) {
        input.value = incoming;
      }
      setFrameHeight();
    }

    input.addEventListener("input", () => {
      const cursorBefore = input.selectionStart ?? input.value.length;
      const digitsBefore = input.value.slice(0, cursorBefore).replace(/\D/g, "").length;
      const formatted = format(input.value);
      input.value = formatted;

      // Reposiciona o cursor contando apenas os dígitos que estavam antes dele.
      let pos = 0;
      let digits = 0;
      while (pos < formatted.length && digits < digitsBefore) {
        if (/\d/.test(formatted[pos])) digits++;
        pos++;
      }
      input.setSelectionRange(pos, pos);
      sendValue();
    });

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || !data.type) return;
      if (data.type === "streamlit:render") render(data.args || {});
    });

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
    setFrameHeight();
  </script>
</body>
</html>
